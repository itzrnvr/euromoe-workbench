<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #000;
  --bg2: #0a0a0a;
  --g100: #111;
  --g200: #1a1a1a;
  --g300: #2a2a2a;
  --g400: #3a3a3a;
  --g500: #666;
  --g600: #888;
  --g700: #aaa;
  --g800: #ccc;
  --g900: #eee;
  --g1000: #fff;
  --blue: #0070f3;
  --green: #00c853;
  --red: #e00;
  --amber: #f59e0b;
  --r-sm: 6px;
  --r-md: 12px;
  --r-lg: 16px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg1); color: var(--g1000);
  font-family: var(--font); font-size: 14px; line-height: 1.5;
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}
.hd {
  height: 56px; display: flex; align-items: center;
  padding: 0 var(--s6); gap: var(--s4);
  border-bottom: 1px solid var(--g200); background: var(--bg2);
}
.hd-logo { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.hd-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.hd-meta { font-size: 13px; color: var(--g600); font-family: var(--mono); }
.hd-right { margin-left: auto; font-size: 13px; color: var(--g600); font-family: var(--mono); }
.wrap { flex: 1; display: flex; overflow: hidden; }

/* Chat */
.chat {
  width: 380px; border-right: 1px solid var(--g200);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.chat-h {
  padding: var(--s4) var(--s5); font-size: 13px; font-weight: 600;
  color: var(--g800); border-bottom: 1px solid var(--g200);
  display: flex; align-items: center; justify-content: space-between;
}
.msgs { flex: 1; overflow-y: auto; padding: var(--s4); }
.msg { margin: var(--s3) 0; max-width: 92%; }
.msg.u { margin-left: auto; }
.msg.a { margin-right: auto; }
.msg-r {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--g600); margin-bottom: var(--s1);
}
.msg-b {
  padding: var(--s3) var(--s4); border-radius: var(--r-md);
  font-size: 14px; line-height: 1.6;
}
.msg.u .msg-b { background: var(--g100); border: 1px solid var(--g200); }
.msg.a .msg-b { background: var(--bg2); border: 1px solid var(--g200); white-space: pre-wrap; }
.msg.a:not(.done) .msg-b::after {
  content: "\25CD"; color: var(--blue); animation: blink 1s infinite;
  font-size: 12px; margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }
.inp {
  padding: var(--s3) var(--s4); border-top: 1px solid var(--g200);
  display: flex; gap: var(--s2);
}
.inp textarea {
  flex: 1; background: var(--g100); border: 1px solid var(--g200);
  border-radius: var(--r-sm); color: var(--g1000);
  padding: var(--s2) var(--s3); font-size: 14px;
  font-family: var(--font); resize: none; height: 44px;
}
.inp textarea:focus { outline: none; border-color: var(--blue); }

/* Buttons */
.btn {
  padding: 0 var(--s4); height: 32px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all 0.15s; border: 1px solid transparent;
  font-family: var(--font); display: inline-flex; align-items: center;
  justify-content: center; gap: var(--s2);
}
.btn-p { background: var(--g1000); color: var(--bg1); border-color: var(--g1000); }
.btn-p:hover { background: var(--g800); border-color: var(--g800); }
.btn-s { background: var(--bg1); color: var(--g1000); border-color: var(--g400); }
.btn-s:hover { background: var(--g100); border-color: var(--g500); }
.btn-g { background: var(--green); color: var(--bg1); border-color: var(--green); }
.btn-r { background: var(--red); color: var(--g1000); border-color: var(--red); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { height: 28px; padding: 0 var(--s3); font-size: 12px; }

/* Analysis */
.an { flex: 1; overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); }
.ctrl {
  display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap;
  padding: var(--s3) var(--s4); background: var(--bg2);
  border: 1px solid var(--g200); border-radius: var(--r-md);
}
.ctrl-st { font-size: 12px; color: var(--g600); margin-left: auto; font-family: var(--mono); }
.row { display: grid; gap: var(--s4); }
.r3 { grid-template-columns: 1fr 1fr 1fr; }
.r2 { grid-template-columns: 1fr 1fr; }
.pn {
  background: var(--bg2); border: 1px solid var(--g200);
  border-radius: var(--r-md); padding: var(--s4);
}
.pn h3 { font-size: 13px; font-weight: 600; margin-bottom: var(--s2); color: var(--g900); }
.pn .desc { font-size: 12px; color: var(--g600); margin-bottom: var(--s3); line-height: 1.4; }

/* Predictions */
.pr {
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--s2) var(--s3); border-radius: var(--r-sm);
  font-size: 13px; cursor: pointer; transition: all 0.1s;
  border: 1px solid transparent; margin-bottom: var(--s1);
}
.pr:hover { background: var(--g100); border-color: var(--g300); }
.pr.sel { background: rgba(0,112,243,0.1); border-color: var(--blue); }
.pr .tk { font-weight: 500; font-family: var(--mono); }
.pr .pi { font-size: 11px; color: var(--g600); margin-left: var(--s2); }
.pr .pp { font-family: var(--mono); font-size: 12px; color: var(--blue); }

/* Expert Grid */
.eg { display: grid; grid-template-columns: repeat(8,1fr); gap: 3px; }
.ec {
  aspect-ratio: 1.1; border-radius: 4px; background: var(--g100);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; font-size: 10px; color: var(--g600);
  line-height: 1.3; font-family: var(--mono);
}
.ec.on { background: rgba(0,200,83,0.12); color: var(--green); border: 1px solid rgba(0,200,83,0.25); }
.ec.hot { background: rgba(0,112,243,0.15); color: var(--blue); border: 1px solid var(--blue); }
.ec .pct { font-size: 8px; opacity: 0.7; }

/* Timing */
.tb { display: flex; height: 20px; border-radius: var(--r-sm); overflow: hidden; margin: var(--s2) 0; }
.tb .sg {
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--g1000); font-weight: 600;
  transition: width 0.3s; overflow: hidden;
}
.sg.a { background: var(--blue); }
.sg.m { background: var(--green); }
.sg.o { background: var(--g400); }
.tv { display: flex; gap: var(--s4); font-size: 12px; color: var(--g600); flex-wrap: wrap; }
.tv b { color: var(--g1000); font-family: var(--mono); }

/* Token Display */
.ct { font-size: 24px; font-weight: 700; color: var(--blue); font-family: var(--mono); }
.ci { font-size: 12px; color: var(--g600); margin-top: var(--s2); line-height: 1.5; }

canvas { display: block; width: 100%; }
.empty { text-align: center; padding: var(--s8) var(--s5); color: var(--g600); font-size: 14px; }
.thinking { color: var(--g600); font-style: italic; }
.ci-input {
  width: 100%; padding: var(--s2) var(--s3); background: var(--g100);
  border: 1px solid var(--g200); border-radius: var(--r-sm);
  color: var(--g1000); font-size: 13px; font-family: var(--mono);
  margin-bottom: var(--s2);
}
.ci-input:focus { outline: none; border-color: var(--blue); }
</style>
</head>
<body>
<div class="hd">
  <span class="hd-dot"></span>
  <span class="hd-logo">Workbench</span>
  <span class="hd-meta" id="meta">Loading...</span>
  <span class="hd-right" id="gpu">GPU --</span>
</div>
<div class="wrap">
  <div class="chat">
    <div class="chat-h">
      Chat
      <div style="display:flex;gap:var(--s2)">
        <button class="btn btn-s btn-sm" onclick="clearChat()">Clear</button>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inp">
      <textarea id="ti" placeholder="Ask..." rows="1"></textarea>
      <button class="btn btn-p" id="sb" onclick="send()" disabled>Send</button>
    </div>
  </div>
  <div class="an" id="an">
    <div class="empty">Send a message to begin.</div>
  </div>
</div>
<script>
var NL=24,NE=64,analyzeData=null,autoRun=false,autoT=null;
var curMsg=null,curText="",selectedPred=null;

async function poll(){
  try{
    var r=await fetch("/api/status");var d=await r.json();
    if(d.loaded){
      document.getElementById("meta").textContent=d.n_layers+"L \u00b7 "+d.n_experts+"E";
      document.getElementById("gpu").textContent="GPU "+d.gpu_memory.allocated_mb+"/"+d.gpu_memory.total_mb+"MB";
      document.getElementById("sb").disabled=false;NL=d.n_layers;NE=d.n_experts;
    }
  }catch(e){}
}

function addM(role,text){
  var d=document.createElement("div");
  d.className="msg "+(role=="user"?"u":"a");
  d.innerHTML='<div class="msg-r">'+(role=="user"?"You":"Assistant")+'</div><div class="msg-b">'+text+'</div>';
  var c=document.getElementById("msgs");c.appendChild(d);c.scrollTop=c.scrollHeight;return d;
}

async function clearChat(){
  if(autoRun)stopAuto();
  await fetch("/api/clear",{method:"POST"});
  document.getElementById("msgs").innerHTML="";
  document.getElementById("an").innerHTML='<div class="empty">Send a message to begin.</div>';
  curMsg=null;curText="";analyzeData=null;selectedPred=null;
  document.getElementById("sb").disabled=false;
}

function send(){
  var t=document.getElementById("ti").value.trim();if(!t)return;
  document.getElementById("ti").value="";
  addM("user",t);
  curMsg=addM("a",'<span class="thinking">Thinking...</span>');
  curText="";analyzeData=null;selectedPred=null;
  document.getElementById("sb").disabled=true;
  fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:t})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.error){alert(d.error);document.getElementById("sb").disabled=false;return;}
      buildPanels();doAnalyze();
    });
}

function buildPanels(){
  var an=document.getElementById("an");
  an.innerHTML=
    '<div class="ctrl" id="ctrl-bar">'+
      '<button class="btn btn-p" id="btn-gen" onclick="doAnalyze()">Generate</button>'+
      '<button class="btn btn-g" id="btn-auto" onclick="toggleAuto()">Auto</button>'+
      '<button class="btn btn-r" id="btn-stop" onclick="stopAuto()" style="display:none">Stop</button>'+
      '<span class="ctrl-st" id="step-info">Ready</span>'+
    '</div>'+
    '<div class="row r3">'+
      '<div class="pn"><h3>Predictions</h3><div class="desc">Click to select, then commit.</div><div id="preds"></div>'+
        '<div id="commit-area" style="margin-top:12px;display:none">'+
          '<input type="text" class="ci-input" id="custom-tok" placeholder="Type custom token...">'+
          '<div style="display:flex;gap:8px">'+
            '<button class="btn btn-p" style="flex:1" onclick="commitGreedy()">Accept: <span id="greedy-text">\u2014</span></button>'+
            '<button class="btn btn-s" onclick="commitCustom()">Force</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="pn"><h3>Routing</h3><div class="desc">8 of 64 experts per layer.</div>'+
        '<div style="font-size:12px;color:var(--g600);margin-bottom:8px">Layer <b id="rl" style="color:var(--g1000)">\u2014</b></div>'+
        '<div class="eg" id="eg"></div>'+
      '</div>'+
      '<div class="pn"><h3>Timing</h3><div class="desc">Attention vs experts vs other.</div>'+
        '<div class="tb"><div class="sg a" id="sa"></div><div class="sg m" id="sm"></div><div class="sg o" id="so"></div></div>'+
        '<div class="tv"><span>Att <b id="va">0</b>ms</span><span>MoE <b id="vm">0</b>ms</span><span>Oth <b id="vo">0</b>ms</span><span>Tot <b id="vt">0</b>ms</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="row r2">'+
      '<div class="pn"><h3>Hidden State</h3><div class="desc">Magnitude across 24 layers.</div>'+
        '<canvas id="hc" style="height:120px"></canvas>'+
        '<div style="font-size:11px;color:var(--g600);margin-top:8px" id="pk"></div>'+
      '</div>'+
      '<div class="pn"><h3>Current Token</h3><div class="desc">What the model computed this step.</div>'+
        '<div class="ct" id="cur-tok">\u2014</div>'+
        '<div class="ci" id="cur-info">No analysis yet</div>'+
      '</div>'+
    '</div>';
  var eg=document.getElementById("eg");
  for(var i=0;i<NE;i++){
    var c=document.createElement("div");c.className="ec";c.id="e"+i;c.textContent="E"+i;eg.appendChild(c);
  }
}

async function doAnalyze(){
  var btn=document.getElementById("btn-gen");if(btn)btn.disabled=true;
  document.getElementById("step-info").textContent="Analyzing...";
  if(curMsg)curMsg.querySelector(".msg-b").innerHTML='<span class="thinking">Generating...</span>';
  var r=await fetch("/api/analyze",{method:"POST"});var d=await r.json();
  if(d.error){document.getElementById("step-info").textContent="Error: "+d.error;if(btn)btn.disabled=false;return;}
  analyzeData=d;selectedPred=null;showAnalysis(d);
  if(curMsg)curMsg.querySelector(".msg-b").innerHTML='<span class="thinking">Select next token...</span>';
  document.getElementById("step-info").textContent="Choose a token";
  document.getElementById("commit-area").style.display="";
  document.getElementById("greedy-text").textContent=d.greedy.token;
  if(btn)btn.disabled=false;
  if(autoRun){await new Promise(function(r){setTimeout(r,50)});commitGreedy();}
}

function showAnalysis(d){
  var pl=document.getElementById("preds");pl.innerHTML="";
  d.preds.forEach(function(p){
    var e=document.createElement("div");
    e.className="pr"+(p.id===d.greedy.id?" sel":"");
    e.innerHTML='<span><span class="tk">'+p.t+'</span><span class="pi">id:'+p.id+'</span></span><span class="pp">'+(p.p*100).toFixed(1)+'%</span>';
    e.onclick=function(){selectPred(p,e);};
    pl.appendChild(e);
  });
  if(d.routing&&d.routing.length){
    var r=d.routing[d.routing.length-1],ei=r.indices||[],ew=r.weights||[],mw=0;
    ew.forEach(function(w){if(w>mw)mw=w;});
    document.getElementById("rl").textContent="L"+(r.layer+1);
    for(var i=0;i<NE;i++){
      var c=document.getElementById("e"+i),p=ei.indexOf(i);
      if(p>=0){c.className="ec "+(ew[p]===mw?"hot":"on");c.innerHTML="E"+i+'<span class="pct">'+(ew[p]*100).toFixed(0)+'%</span>';}
      else{c.className="ec";c.textContent="E"+i;}
    }
  }
  var t=d.time_ms||0,a=d.attn_total||0,m=d.moe_total||0,o=d.other_ms||0;
  document.getElementById("sa").style.width=(a/t*100)+"%";
  document.getElementById("sm").style.width=(m/t*100)+"%";
  document.getElementById("so").style.width=(o/t*100)+"%";
  document.getElementById("va").textContent=a.toFixed(0);
  document.getElementById("vm").textContent=m.toFixed(0);
  document.getElementById("vo").textContent=o.toFixed(0);
  document.getElementById("vt").textContent=t.toFixed(0);
  if(d.hidden&&d.hidden.length)drawChart(d.hidden);
  document.getElementById("cur-tok").textContent='"'+d.greedy.token+'"';
  document.getElementById("cur-info").textContent="Greedy pick \u00b7 "+(d.preds[0].p*100).toFixed(1)+"% confidence \u00b7 "+t.toFixed(0)+"ms";
}

function selectPred(p,el){
  selectedPred=p;
  document.querySelectorAll(".pr").forEach(function(e){e.classList.remove("sel");});
  el.classList.add("sel");
  document.getElementById("greedy-text").textContent=p.t;
}

async function commitGreedy(){
  var token_id=selectedPred?selectedPred.id:analyzeData.greedy.id;
  await doCommit(token_id);
}

async function commitCustom(){
  var inp=document.getElementById("custom-tok"),text=inp.value.trim();if(!text)return;inp.value="";
  var r=await fetch("/api/tokenize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text})});
  var d=await r.json();if(d.tokens&&d.tokens.length>0)await doCommit(d.tokens[0].id);
}

async function doCommit(token_id){
  document.getElementById("step-info").textContent="Committing...";
  document.getElementById("commit-area").style.display="none";
  var r=await fetch("/api/commit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token_id:token_id})});
  var d=await r.json();if(d.error){alert(d.error);return;}
  var txt=(d.text||"").split("").join("");
    curText=txt;
  if(curMsg){curMsg.querySelector(".msg-b").textContent=txt;var c=document.getElementById("msgs");c.scrollTop=c.scrollHeight;}
  selectedPred=null;analyzeData=null;
  if(d.done){stopAuto();document.getElementById("sb").disabled=false;if(curMsg)curMsg.classList.add("done");document.getElementById("step-info").textContent="Done";return;}
  if(autoRun){await new Promise(function(r){setTimeout(r,80)});doAnalyze();}
  else{document.getElementById("step-info").textContent="Ready for next token";}
}

function toggleAuto(){if(autoRun)stopAuto();else{autoRun=true;document.getElementById("btn-auto").style.display="none";document.getElementById("btn-stop").style.display="";if(analyzeData)commitGreedy();else doAnalyze();}}
function stopAuto(){autoRun=false;if(autoT)clearTimeout(autoT);var a=document.getElementById("btn-auto"),s=document.getElementById("btn-stop");if(a)a.style.display="";if(s)s.style.display="none";}

function drawChart(hs){
  var cv=document.getElementById("hc");if(!cv)return;
  var ct=cv.parentElement;var w=ct.clientWidth-32,h=120;
  cv.width=w;cv.height=h;var x=cv.getContext("2d");x.clearRect(0,0,w,h);
  if(!hs||hs.length<2)return;
  if(cv.getContext("2d")!=="ready"){
    x=cv.getContext("2d");
    if(x===null||x===undefined)return;
  }
  var mx=0;hs.forEach(function(e){if(e.norm>mx)mx=e.norm});mx=mx||1;
  var pL=30,pR=10,pT=10,pB=20;var pw=w-pL-pR,ph=h-pTapB;var sx=pw/(hs.length-1);
  x.strokeStyle="#1a1a1a";x.fillStyle="#666";x.font="9px sans-serif";x.textAlign="right";
  for(var i=0;i<=3;i++){var y=pT+ph*i/3;x.beginPath();x.moveTo(pL,y);x.lineTo(pL+pw,y);x.stroke();x.setLineDash([2,2]);x.stroke();x.setLineDash([]);x.fillText((mx*(1-i/3)).toFixed(0),pL-4,y+3);}
  x.strokeStyle="#0070f3";x.lineWidth=2;x.beginPath();
  hs.forEach(function(e,i){var cx=pL+i*sx,cy=pT+ph-(e.norm/mx)*ph;if(i===0)x.moveTo(cx,cy);else x.lineTo(cx,cy);});
  x.stroke();
  x.fillStyle="rgba(0,112,243,0.08)";x.beginPath();x.moveTo(pL,pT+ph);
  hs.forEach(function(e,i){var cx=pL+i*sx,cy=pT+ph-(e.norm/mx)*ph;x.lineTo(cx,cy);});
  x.lineTo(pL+pw,pT+ph);x.fill();
  x.fillStyle="#666";x.textAlign="center";
  hs.forEach(function(e,i){if(i%8===0||i===hs.length-1)x.fillText("L"+(e.layer+1),pL+i*sx,pT+ph+12);});
  var pk=0,pv=0;hs.forEach(function(e,ii{if(e.norm>pv){pv=e.norm;pk=i;}});
  var px=pL+pk*sx,py=pT+ph-(pv/mx)*ph;
  x.fillStyle="#0070f3";x.beginPath();x.arc(px,py,3,0,Math.PI*2);x.fill();
  var pl=document.getElementById("pk");if(pl)pl.textContent="Peak L"+(hs[pk].layer+1)+": "+pv.toFixed(0);
}

poll();setInterval(poll,5000);
document.getElementById("ti").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});



</script>
</body>
</html>
