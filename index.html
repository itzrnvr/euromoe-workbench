<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<style>
:root{--bg:#0c0c0e;--s:#161618;--s2:#1c1c20;--b:#26262c;--t:#f0f0f2;--m:#7a7a82;--a:#e85d04;--g:#2ec4b6;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:'Inter',system-ui,sans-serif;font-size:13px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.hd{height:48px;display:flex;align-items:center;padding:0 20px;gap:14px;border-bottom:1px solid var(--b)}
.hd .logo{font-weight:700;font-size:15px;letter-spacing:-.3px}
.hd .dot{width:6px;height:6px;border-radius:50%;background:var(--g)}
.hd .meta{font-size:11px;color:var(--m)}
.hd .right{margin-left:auto;font-size:11px;color:var(--m)}
.wrap{flex:1;display:flex;overflow:hidden}
.chat{width:360px;border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0}
.chat-h{padding:12px 16px;font-size:12px;color:var(--m);font-weight:600;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between}
.msgs{flex:1;overflow-y:auto;padding:14px}
.m{margin:8px 0;max-width:92%}
.m.u{margin-left:auto}.m.a{margin-right:auto}
.m .b{padding:10px 14px;border-radius:var(--r);font-size:13px;line-height:1.6}
.m.u .b{background:var(--s2)}.m.a .b{background:var(--s);border:1px solid var(--b);white-space:pre-wrap}
.m .r{font-size:9px;color:var(--m);margin-bottom:3px;text-transform:uppercase;font-weight:600}
.m.a:not(.done) .b::after{content:" ▍";color:var(--a);animation:1s blink infinite}
@keyframes blink{50%{opacity:0}}
.inp{padding:10px 14px;border-top:1px solid var(--b);display:flex;gap:8px}
.inp textarea{flex:1;background:var(--s);border:1px solid var(--b);border-radius:8px;color:var(--t);padding:8px 10px;font-size:13px;resize:none;height:44px;font-family:inherit}
.inp textarea:focus{outline:none;border-color:var(--a)}
.inp button{background:var(--a);color:#fff;border:none;padding:0 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.inp button:disabled{opacity:.3;cursor:default}
.an{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;gap:12px}.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr 1fr}
.p{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:16px}
.p h3{font-size:12px;font-weight:600;margin-bottom:8px}
.p .d{font-size:11px;color:var(--m);margin-bottom:10px;line-height:1.4}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--s);border:1px solid var(--b);border-radius:var(--r)}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--b);background:var(--s2);color:var(--t);font-size:12px;cursor:pointer;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.grn{background:var(--g);border-color:var(--g);color:#000}
.btn:disabled{opacity:.3}
.tbar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0}
.tbar .s{display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:600;transition:width .3s;overflow:hidden}
.s.at{background:var(--a)}.s.mo{background:var(--g)}.s.ot{background:#555}
.tvals{display:flex;gap:14px;font-size:11px;color:var(--m);flex-wrap:wrap}
.tvals b{color:var(--t);font-family:monospace}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.ec{aspect-ratio:1.1;border-radius:4px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:var(--m);line-height:1.3}
.ec.on{background:rgba(46,196,182,.15);color:var(--g);border:1px solid rgba(46,196,182,.3)}
.ec.hot{background:rgba(232,93,4,.2);color:var(--a);border:1px solid var(--a)}
.ec .pct{font-size:7px;opacity:.7}
.pr{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;font-size:12px;cursor:pointer;transition:.1s;border:1px solid transparent}
.pr:hover{background:var(--s2);border-color:var(--b)}
.pr.sel{background:rgba(232,93,4,.1);border-color:var(--a)}
.pr .t{font-weight:500}.pr .p{font-family:monospace;color:var(--a);font-size:10px}
.pr .pid{font-size:9px;color:var(--m);margin-left:4px}
canvas{display:block;width:100%}
.empty{text-align:center;padding:60px 20px;color:var(--m);font-size:14px}
.thinking{color:var(--m);font-style:italic}
</style>
</head>
<body>
<div class="hd">
  <span class="dot"></span><span class="logo">Workbench</span>
  <span class="meta" id="meta">Loading</span>
  <span class="right" id="gpu">GPU —</span>
</div>
<div class="wrap">
  <div class="chat">
    <div class="chat-h">Chat<div style="display:flex;gap:6px"><button class="btn" style="padding:3px 10px;font-size:11px" onclick="clearChat()">Clear</button></div></div>
    <div class="msgs" id="msgs"></div>
    <div class="inp"><textarea id="ti" placeholder="Ask..." rows="1"></textarea><button id="sb" onclick="send()" disabled>Send</button></div>
  </div>
  <div class="an" id="an"><div class="empty">Send a message to begin.</div></div>
</div>
<script>
var NL=24,NE=64,analyzeData=null,autoRun=false,autoT=null;
var curMsg=null,curText="";

async function poll(){
  try{var r=await fetch("/api/status");var d=await r.json();
    if(d.loaded){document.getElementById("meta").textContent=d.n_layers+"L · "+d.n_experts+"E";document.getElementById("gpu").textContent="GPU "+d.gpu_memory.allocated_mb+"/"+d.gpu_memory.total_mb+"MB";document.getElementById("sb").disabled=false;NL=d.n_layers;NE=d.n_experts;}
  }catch(e){}
}
function addM(role,text){var d=document.createElement("div");d.className="m "+(role=="user"?"u":"a");d.innerHTML='<div class="r">'+(role=="user"?"You":"Assistant")+'</div><div class="b">'+text+'</div>';var c=document.getElementById("msgs");c.appendChild(d);c.scrollTop=c.scrollHeight;return d;}

async function clearChat(){
  if(autoRun)stopAuto();
  await fetch("/api/clear",{method:"POST"});
  document.getElementById("msgs").innerHTML="";
  document.getElementById("an").innerHTML='<div class="empty">Send a message to begin.</div>';
  curMsg=null;curText="";analyzeData=null;
  document.getElementById("sb").disabled=false;
}

function send(){
  var t=document.getElementById("ti").value.trim();if(!t)return;
  document.getElementById("ti").value="";
  addM("user",t);
  curMsg=addM("a",'<span class="thinking">Thinking...</span>');
  curText="";analyzeData=null;
  document.getElementById("sb").disabled=true;
  fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:t})})
    .then(r=>r.json()).then(d=>{
      if(d.error){alert(d.error);document.getElementById("sb").disabled=false;return;}
      buildPanels();
      doAnalyze();
    });
}

function buildPanels(){
  var an=document.getElementById("an");
  an.innerHTML=`
    <div class="ctrl" id="ctrl-bar">
      <button class="btn pri" id="btn-gen" onclick="doAnalyze()">Generate</button>
      <button class="btn grn" id="btn-auto" onclick="toggleAuto()">Auto</button>
      <button class="btn red" id="btn-stop" onclick="stopAuto()" style="display:none;background:#e74c3c;border-color:#e74c3c;color:#fff">Stop</button>
      <span style="flex:1"></span>
      <span style="font-size:11px;color:var(--m)" id="step-info">Ready</span>
    </div>
    <div class="row row3">
      <div class="p"><h3>Predictions</h3><div class="d">Click to select, then commit.</div><div id="preds"></div>
        <div id="commit-area" style="margin-top:8px;display:none">
          <input type="text" id="custom-tok" placeholder="Type custom token..." style="width:100%;padding:5px 8px;background:var(--s);border:1px solid var(--b);border-radius:5px;color:var(--t);font-size:12px;margin-bottom:6px">
          <div style="display:flex;gap:6px">
            <button class="btn pri" style="flex:1" onclick="commitGreedy()">Accept: <span id="greedy-text">—</span></button>
            <button class="btn" onclick="commitCustom()">Force Custom</button>
          </div>
        </div>
      </div>
      <div class="p"><h3>Routing</h3><div class="d">8 of 64 experts per layer.</div>
        <div style="font-size:11px;color:var(--m);margin-bottom:6px">Layer <b id="rl" style="color:var(--t)">—</b></div>
        <div class="eg" id="eg"></div>
      </div>
      <div class="p"><h3>Timing</h3><div class="d">Attention vs experts vs other.</div>
        <div class="tbar"><div class="s at" id="sa"></div><div class="s mo" id="sm"></div><div class="s ot" id="so"></div></div>
        <div class="tvals"><span>Att <b id="va">0</b>ms</span><span>MoE <b id="vm">0</b>ms</span><span>Oth <b id="vo">0</b>ms</span><span>Tot <b id="vt">0</b>ms</span></div>
      </div>
    </div>
    <div class="row row2">
      <div class="p"><h3>Hidden State</h3><div class="d">Magnitude across 24 layers.</div>
        <canvas id="hc" style="height:120px"></canvas>
        <div style="font-size:10px;color:var(--m);margin-top:4px" id="pk"></div>
      </div>
      <div class="p"><h3>Current Token</h3><div class="d">What the model computed this step.</div>
        <div id="cur-tok" style="font-size:20px;font-weight:700;color:var(--a)">—</div>
        <div id="cur-info" style="font-size:11px;color:var(--m);margin-top:4px">No analysis yet</div>
      </div>
    </div>
  `;
  var eg=document.getElementById("eg");
  for(var i=0;i<NE;i++){var c=document.createElement("div");c.className="ec";c.id="e"+i;c.innerHTML="E"+i;eg.appendChild(c);}
}

async function doAnalyze(){
  var btn=document.getElementById("btn-gen");
  if(btn)btn.disabled=true;
  document.getElementById("step-info").textContent="Analyzing...";
  if(curMsg)curMsg.querySelector(".b").innerHTML='<span class="thinking">Generating...</span>';
  
  var r=await fetch("/api/analyze",{method:"POST"});
  var d=await r.json();
  if(d.error){document.getElementById("step-info").textContent="Error: "+d.error;if(btn)btn.disabled=false;return;}
  
  analyzeData=d;
  showAnalysis(d);
  
  if(curMsg)curMsg.querySelector(".b").innerHTML='<span class="thinking">Select next token...</span>';
  document.getElementById("step-info").textContent="Choose a token";
  document.getElementById("commit-area").style.display="";
  document.getElementById("greedy-text").textContent=d.greedy.token;
  if(btn)btn.disabled=false;
  
  if(autoRun){
    await new Promise(r=>setTimeout(r,50));
    commitGreedy();
  }
}

function showAnalysis(d){
  // Predictions
  var pl=document.getElementById("preds");pl.innerHTML="";
  d.preds.forEach(function(p,i){
    var e=document.createElement("div");e.className="pr"+(p.id===d.greedy.id?" sel":"");
    e.innerHTML='<span><span class="t">'+p.t+'</span><span class="pid">id:'+p.id+'</span></span><span class="p">'+(p.p*100).toFixed(1)+'%</span>';
    e.onclick=function(){selectPred(p);};
    pl.appendChild(e);
  });
  
  // Routing
  if(d.routing&&d.routing.length){
    var r=d.routing[d.routing.length-1];
    var ei=r.indices||[],ew=r.weights||[];
    var mw=0;ew.forEach(function(w){if(w>mw)mw=w;});
    document.getElementById("rl").textContent="L"+(r.layer+1);
    for(var i=0;i<NE;i++){
      var c=document.getElementById("e"+i);var p=ei.indexOf(i);
      if(p>=0){c.className="ec "+(ew[p]===mw?"hot":"on");c.innerHTML="E"+i+'<span class="pct">'+(ew[p]*100).toFixed(0)+'%</span>';}
      else{c.className="ec";c.innerHTML="E"+i;}
    }
  }
  
  // Timing
  var t=d.time_ms||0,a=d.attn_total||0,m=d.moe_total||0,o=d.other_ms||0;
  document.getElementById("sa").style.width=(a/t*100)+"%";
  document.getElementById("sm").style.width=(m/t*100)+"%";
  document.getElementById("so").style.width=(o/t*100)+"%";
  document.getElementById("va").textContent=a.toFixed(0);
  document.getElementById("vm").textContent=m.toFixed(0);
  document.getElementById("vo").textContent=o.toFixed(0);
  document.getElementById("vt").textContent=t.toFixed(0);
  
  // Hidden state
  if(d.hidden&&d.hidden.length)drawChart(d.hidden);
  
  // Current token panel
  document.getElementById("cur-tok").textContent='"'+d.greedy.token+'"';
  document.getElementById("cur-info").textContent="Greedy pick · "+(d.preds[0].p*100).toFixed(1)+"% confidence · "+t.toFixed(0)+"ms";
}

var selectedPred=null;
function selectPred(p){
  selectedPred=p;
  document.querySelectorAll(".pr").forEach(function(el){el.classList.remove("sel");});
  event.currentTarget.classList.add("sel");
  document.getElementById("greedy-text").textContent=p.t;
}

async function commitGreedy(){
  var token_id=selectedPred?selectedPred.id:analyzeData.greedy.id;
  await doCommit(token_id);
}

async function commitCustom(){
  var inp=document.getElementById("custom-tok");
  var text=inp.value.trim();if(!text)return;
  inp.value="";
  // Tokenize the custom text
  var r=await fetch("/api/tokenize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text})});
  var d=await r.json();
  if(d.tokens&&d.tokens.length>0){await doCommit(d.tokens[0].id);}
}

async function doCommit(token_id){
  document.getElementById("step-info").textContent="Committing...";
  document.getElementById("commit-area").style.display="none";
  
  var r=await fetch("/api/commit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token_id:token_id})});
  var d=await r.json();
  if(d.error){alert(d.error);return;}
  
  // Update chat
  var txt=(d.text||"").split("<|im_end|>").join("").split("<|endoftext|>").join("").trim();
  curText=txt;
  if(curMsg){curMsg.querySelector(".b").textContent=txt;var c=document.getElementById("msgs");c.scrollTop=c.scrollHeight;}
  
  selectedPred=null;analyzeData=null;
  
  if(d.done){
    stopAuto();
    document.getElementById("sb").disabled=false;
    if(curMsg)curMsg.classList.add("done");
    document.getElementById("step-info").textContent="Done";
    return;
  }
  
  // Auto mode: immediately analyze next
  if(autoRun){await new Promise(r=>setTimeout(r,80));doAnalyze();}
  else{document.getElementById("step-info").textContent="Ready for next token";}
}

function toggleAuto(){if(autoRun)stopAuto();else{autoRun=true;document.getElementById("btn-auto").style.display="none";document.getElementById("btn-stop").style.display="";if(analyzeData)commitGreedy();else doAnalyze();}}
function stopAuto(){autoRun=false;if(autoT)clearTimeout(autoT);var a=document.getElementById("btn-auto"),s=document.getElementById("btn-stop");if(a)a.style.display="";if(s)s.style.display="none";}

function drawChart(hs){
  var cv=document.getElementById("hc");if(!cv)return;
  var ct=cv.parentElement;var w=ct.clientWidth-32,h=120;
  cv.width=w;cv.height=h;var x=cv.getContext("2d");x.clearRect(0,0,w,h);
  if(!hs||hs.length<2)return;
  var mx=0;hs.forEach(function(e){if(e.norm>mx)mx=e.norm});mx=mx||1;
  var pL=30,pR=10,pT=10,pB=20;var pw=w-pL-pR,ph=h-pT-pB;var sx=pw/(hs.length-1);
  x.strokeStyle="#26262c";x.fillStyle="#7a7a82";x.font="9px sans-serif";x.textAlign="right";
  for(var i=0;i<=3;i++){var y=pT+ph*i/3;x.beginPath();x.moveTo(pL,y);x.lineTo(pL+pw,y);x.stroke();x.fillText((mx*(1-i/3)).toFixed(0),pL-4,y+3)}
  x.strokeStyle="#e85d04";x.lineWidth=2;x.beginPath();
  hs.forEach(function(e,i){var cx=pL+i*sx,cy=pT+ph-(e.norm/mx)*ph;if(i===0)x.moveTo(cx,cy);else x.lineTo(cx,cy)});
  x.stroke();
  x.fillStyle="rgba(232,93,4,.08)";x.beginPath();x.moveTo(pL,pT+ph);
  hs.forEach(function(e,i){var cx=pL+i*sx,cy=pT+ph-(e.norm/mx)*ph;x.lineTo(cx,cy)});
  x.lineTo(pL+pw,pT+ph);x.fill();
  x.fillStyle="#7a7a82";x.textAlign="center";
  hs.forEach(function(e,i){if(i%8===0||i===hs.length-1)x.fillText("L"+(e.layer+1),pL+i*sx,pT+ph+12)});
  var pk=0,pv=0;hs.forEach(function(e,i){if(e.norm>pv){pv=e.norm;pk=i}});
  var px=pL+pk*sx,py=pT+ph-(pv/mx)*ph;
  x.fillStyle="#e85d04";x.beginPath();x.arc(px,py,3,0,Math.PI*2);x.fill();
  var pl=document.getElementById("pk");if(pl)pl.textContent="Peak L"+(hs[pk].layer+1)+": "+pv.toFixed(0);
}

poll();setInterval(poll,5000);
document.getElementById("ti").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body>
</html>
